<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Chess with Claude</title>
  <meta name="theme-color" content="#f5f6f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181d1a" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.cburnett.css">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <main class="app" id="app" hidden>
    <section class="board-col" aria-label="Chess board and game controls">
      <div class="board-stack">
        <div class="player" id="player-top"></div>
        <div class="board-area">
          <div class="evalbar" id="evalbar" hidden><div class="evalbar-fill"></div></div>
          <div class="board-wrap">
            <div id="board" tabindex="-1" aria-label="Chess board"></div>
            <div class="promo" id="promo" role="dialog" aria-label="Choose a promotion piece" hidden></div>
          </div>
        </div>
        <div class="player" id="player-bottom"></div>
        <p class="best-line" id="best-line" hidden></p>
        <div id="mobile-status" class="mobile-only">
          <div id="mobile-status-row"></div>
          <button id="chat-preview" type="button" aria-label="Open conversation with Claude" aria-haspopup="dialog" aria-controls="dlg-chat" hidden></button>
        </div>
        <nav class="controls" aria-label="Game controls">
          <button id="btn-new" type="button" title="New game" aria-label="New game">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button id="btn-draw" type="button" title="Offer a draw" aria-label="Offer a draw">½</button>
          <button id="btn-resign" type="button" title="Resign" aria-label="Resign">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>
          </button>
          <span class="spacer"></span>
          <button id="btn-flip" type="button" title="Flip board" aria-label="Flip board">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20V4M3 8l4-4 4 4M17 4v16M13 16l4 4 4-4"/></svg>
          </button>
          <button id="btn-eval" type="button" title="Evaluation bar" aria-label="Evaluation bar" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M6 10v11M18 14v7"/></svg>
          </button>
          <button id="btn-games" type="button" title="Past games" aria-label="Past games">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/></svg>
          </button>
          <button id="btn-moves" class="mobile-only" type="button" title="Moves" aria-label="Moves" aria-haspopup="dialog" aria-controls="dlg-moves">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 5h13M8 12h13M8 19h13M3 5h.01M3 12h.01M3 19h.01"/></svg>
          </button>
          <button id="btn-chat" class="mobile-only" type="button" title="Chat" aria-label="Chat" aria-haspopup="dialog" aria-controls="dlg-chat">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11a8 8 0 0 1-8 8H7l-4 3V11a9 9 0 0 1 18 0Z"/></svg>
            <span id="chat-unread" class="unread-dot" aria-hidden="true" hidden></span>
          </button>
        </nav>
      </div>
    </section>

    <aside class="panel">
      <header class="panel-head">
        <div>
          <h1 id="panel-title">Claude</h1>
          <p id="status" class="status" role="status"></p>
        </div>
        <button id="btn-claude" class="icon" type="button" title="Claude settings" aria-label="Claude settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h6m4 0h6M4 17h10m4 0h2M10 4v6m4 4v6"/></svg>
        </button>
        <button id="btn-close-review" class="icon" type="button" title="Back to the game" aria-label="Back to the game" hidden>×</button>
      </header>
      <div id="banner" class="banner" aria-live="polite" hidden></div>
      <section id="review" class="review" aria-label="Game analysis" hidden>
        <div class="review-progress" id="review-progress" role="status" hidden><div class="bar"><span></span></div><p></p></div>
        <div class="accuracy" id="accuracy"></div>
        <svg id="graph" class="graph" viewBox="0 0 300 60" preserveAspectRatio="none" role="slider" tabindex="0" aria-label="Position on evaluation graph" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"></svg>
        <table class="counts" id="counts"></table>
      </section>
      <ol id="moves" class="moves" aria-label="Moves"></ol>
      <nav id="review-nav" class="review-nav" aria-label="Review navigation" hidden>
        <button id="review-first" type="button" aria-label="First position" title="First position (Home)">⇤</button>
        <button id="review-prev" type="button" aria-label="Previous move" title="Previous move (←)">←</button>
        <span id="review-position" aria-live="polite"></span>
        <button id="review-next" type="button" aria-label="Next move" title="Next move (→)">→</button>
        <button id="review-last" type="button" aria-label="Last position" title="Last position (End)">⇥</button>
      </nav>
      <div id="chat" class="chat" role="log" aria-label="Conversation with Claude" aria-live="polite"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" placeholder="Message Claude" maxlength="2000" aria-label="Message Claude">
        <button type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </aside>
  </main>

  <dialog id="dlg-chat" class="bottom-sheet" aria-labelledby="chat-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="dlg-head"><h2 id="chat-title">Chat</h2><button id="btn-close-chat" class="icon" type="button" aria-label="Close chat">×</button></header>
    <div id="chat-sheet-content" class="sheet-content"></div>
  </dialog>

  <dialog id="dlg-moves" class="bottom-sheet" aria-labelledby="moves-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="dlg-head"><h2 id="moves-title">Moves</h2><button id="btn-close-moves" class="icon" type="button" aria-label="Close moves">×</button></header>
    <div id="moves-sheet-content" class="sheet-content"></div>
  </dialog>

  <section class="gate" id="gate" hidden>
    <div class="gate-card">
      <h1>Chess with Claude</h1>
      <p id="gate-msg" aria-live="polite">Enter the password to play.</p>
      <form id="gate-form">
        <input id="gate-input" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
        <button class="primary" type="submit">Continue</button>
      </form>
    </div>
  </section>

  <dialog id="dlg-new" aria-labelledby="new-title">
    <form method="dialog">
      <h2 id="new-title">New game</h2>
      <p class="muted">Choose which side you’d like to play.</p>
      <div class="choices">
        <button value="white" aria-label="Play as White"><span class="choice-piece" aria-hidden="true">♔</span>White</button>
        <button value="random" aria-label="Play a random side"><span class="choice-piece" aria-hidden="true">◐</span>Random</button>
        <button value="black" aria-label="Play as Black"><span class="choice-piece" aria-hidden="true">♚</span>Black</button>
      </div>
      <button value="cancel" class="link">Cancel</button>
    </form>
  </dialog>

  <dialog id="dlg-confirm" aria-labelledby="confirm-text">
    <form method="dialog">
      <p id="confirm-text"></p>
      <div class="choices">
        <button value="cancel">Cancel</button>
        <button value="ok" id="confirm-ok" class="primary">OK</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-claude" aria-labelledby="claude-title">
    <form method="dialog">
      <header class="dlg-head"><h2 id="claude-title">Claude settings</h2><button value="close" class="icon" aria-label="Close">×</button></header>
      <div id="claude-settings"></div>
    </form>
  </dialog>

  <dialog id="dlg-games" aria-labelledby="games-title">
    <form method="dialog">
      <header class="dlg-head"><h2 id="games-title">Past games</h2><button value="close" class="icon" aria-label="Close">×</button></header>
      <ul id="games-list" class="games-list"></ul>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>

[project]
name = "chess-mcp"
version = "0.1.0"
description = "Play chess against Claude: MCP tools, a game server with Stockfish, and a web UI"
readme = "README.md"
authors = [
    { name = "manxzo", email = "manxzo.code@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11",
    "httpx>=0.28",
    "mcp>=2.3,<3",
    "starlette>=1.7",
    "uvicorn>=0.54",
    "websockets>=15",
]

[project.scripts]
chess-mcp = "chess_mcp:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
